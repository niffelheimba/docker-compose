services:
  parseable:
    image: quay.io/parseablehq/parseable:latest
    container_name: parseable
    restart: unless-stopped

    command:
      - parseable
      - s3-store

    # Arcane manages this file. Loading it here also passes optional settings,
    # such as P_OIDC_* and P_ORIGIN_URI, through to Parseable.
    env_file:
      - .env

    environment:
      P_ADDR: 0.0.0.0:8000
      P_STAGING_DIR: /parseable/staging
      P_USERNAME: ${P_USERNAME:?Set P_USERNAME in Arcane}
      P_PASSWORD: ${P_PASSWORD:?Set P_PASSWORD in Arcane}
      P_S3_URL: ${P_S3_URL:-http://10.10.60.250:30292}
      P_S3_BUCKET: ${P_S3_BUCKET:-parseable}
      P_S3_REGION: ${P_S3_REGION:-us-east-1}
      P_S3_ACCESS_KEY: ${P_S3_ACCESS_KEY:?Set P_S3_ACCESS_KEY in Arcane}
      P_S3_SECRET_KEY: ${P_S3_SECRET_KEY:?Set P_S3_SECRET_KEY in Arcane}
      P_S3_PATH_STYLE: ${P_S3_PATH_STYLE:-true}

    ports:
      - "8000:8000"

    volumes:
      # Keep the former local-store staging data intact. S3 mode must begin
      # with an empty staging directory that matches the new object store.
      - ./staging-s3:/parseable/staging
