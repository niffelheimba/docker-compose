name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v2.17.2@sha256:ec8417998df367cc2eb6efdfbe9b9607a42ad04b78d1c185ccc5f9f7d943019e
    container_name: arcane
    volumes:
      - /run/user/1003/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - /home/docker-secure/docker-compose/:/app/data/projects
      - /home/docker-secure/docker-compose/arcane/builds:/builds
      - /home/docker-secure/docker-compose/arcane/backups:/backups
    environment:
      - APP_URL=https://arcane.cloud.northlake.dev
      - PUID=1003
      - PGID=1003
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - arcane-net
    restart: unless-stopped

volumes:
  arcane-data:

networks:
  arcane-net:
    external: true
