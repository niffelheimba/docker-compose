name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v2.17.3@sha256:2e0dc9f5ef03599181a49baf6470055d82e24d9cb15bbc62498ea642c0f882a7
    container_name: arcane
    volumes:
      - /run/user/1003/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - /home/docker-secure/docker-compose/:/app/data/projects
      - /home/docker-secure/docker-compose/arcane/builds:/builds
      - /home/docker-secure/docker-compose/arcane/backups:/backups
    environment:
      - APP_URL=https://arcane.cloud.northlake.dev
      - PUID=1003
      - PGID=1003
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - arcane-net
    restart: unless-stopped

volumes:
  arcane-data:

networks:
  arcane-net:
    external: true
