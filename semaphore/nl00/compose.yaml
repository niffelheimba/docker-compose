name: semaphore

services:
  mysql:
    restart: unless-stopped
    image: mysql:26.10.0@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    hostname: mysql
    volumes:
      - semaphore-mysql:/var/lib/mysql
    env_file:
      - .env
    networks:
      - default
      - caddy-net

  semaphore:
    restart: unless-stopped
    image: semaphoreui/semaphore:v2.20.24@sha256:c547d31cba238bee4a9f2b5eec9d0f42b2d5ecb399377a2e63008500d74fbf3a
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - default

volumes:
  semaphore-mysql:
    name: semaphore_semaphore-mysql

networks:
  caddy-net:
    external: true
