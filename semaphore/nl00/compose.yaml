name: semaphore

services:
  mysql:
    restart: unless-stopped
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    hostname: mysql
    volumes:
      - semaphore-mysql:/var/lib/mysql
    env_file:
      - .env
    networks:
      - default
      - caddy-net

  semaphore:
    restart: unless-stopped
    image: semaphoreui/semaphore:v2.20.24@sha256:c547d31cba238bee4a9f2b5eec9d0f42b2d5ecb399377a2e63008500d74fbf3a
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - default

volumes:
  semaphore-mysql:
    name: semaphore_semaphore-mysql

networks:
  caddy-net:
    external: true
