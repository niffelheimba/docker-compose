name: nl10-traefik

services:
  traefik:
    image: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    container_name: traefik
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
      - "${FORGEJO_SSH_PROXY_BIND_IP:-10.10.50.100}:2222:2222/tcp"
    command:
      - --global.sendAnonymousUsage=false
      # Internal-only API for Traefik Manager; port 8080 is not published on
      # the host, so it is reachable only from containers on this Docker network.
      - --api=true
      - --api.insecure=true
      - --api.dashboard=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.forgejo-ssh.address=:2222/tcp
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.http.tls.certResolver=letsencrypt
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=nd.personal@icloud.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=info
      - --log.format=common
      - --accesslog=true
      - --accesslog.format=json
      # Send JSON access logs to stdout so Alloy's Docker source collects them.
    volumes:
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt
      - /home/service/docker-state/traefik/logs:/var/log/traefik
      # Traefik Manager owns this host runtime directory after migration.
      - /home/service/docker-state/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik-net
      - error-pages-net

  error-pages:
    build:
      context: ./error-pages
    image: northlake/error-pages:1.0.0
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    environment:
      GOMEMLIMIT: 32MiB
      GOMAXPROCS: "1"
    networks:
      - error-pages-net

  traefik-manager-agent:
    # Upstream currently publishes the ARM64-compatible Docker image as latest.
    image: ghcr.io/chr0nzz/traefik-manager-agent:1.15.9@sha256:594bb211d18d12663953420c1607f34ede0526e42915f90fc589fcfbab535099
    container_name: traefik-manager-agent
    restart: unless-stopped
    environment:
      TMA_API_KEY: "${TMA_NL10_API_KEY:-}"
      TRAEFIK_API_URL: http://traefik:8080
      CONFIG_PATH: /app/config
      ACME_JSON_PATH: /letsencrypt/acme.json
    ports:
      # Private/Tailscale only. Restrict port 8090 to NL00 in the host firewall.
      # Loopback is a safe bootstrap default. Override with NL10's private or
      # Tailscale IP in Arcane before registering this remote agent.
      - "${TMA_NL10_BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      - /home/service/docker-state/traefik/dynamic:/app/config
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt:ro
      - traefik-manager-agent-backups:/app/backups
    networks:
      - traefik-net

networks:
  error-pages-net:
    internal: true
  traefik-net:
    driver: bridge

volumes:
  traefik-manager-agent-backups:
