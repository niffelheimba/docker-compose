name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./vw-data/:/data/
    # Traefik reaches port 80 over vaultwarden-net; no host port is needed.
    networks:
      - vaultwarden-net

networks:
  vaultwarden-net:
    external: true
