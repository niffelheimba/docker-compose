name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./vw-data/:/data/
    # Traefik reaches port 80 over vaultwarden-net; no host port is needed.
    networks:
      - vaultwarden-net

networks:
  vaultwarden-net:
    external: true
