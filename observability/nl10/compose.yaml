name: grafanaloki

services:
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    ports:
      - "3100:3100"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in Arcane}
      S3_BUCKET: ${S3_BUCKET:-loki}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in Arcane}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Arcane}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
volumes:
  grafana-data:
  loki-data:
