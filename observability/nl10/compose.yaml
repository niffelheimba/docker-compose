services:
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    ports:
      - "3100:3100"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in Arcane}
      S3_BUCKET: ${S3_BUCKET:-loki}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in Arcane}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Arcane}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
volumes:
  grafana-data:
  loki-data:
