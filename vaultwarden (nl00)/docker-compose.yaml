services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./vw-data/:/data/
    # Traefik reaches port 80 over vaultwarden-net; no host port is needed.
    networks:
      - vaultwarden-net

networks:
  vaultwarden-net:
    external: true
