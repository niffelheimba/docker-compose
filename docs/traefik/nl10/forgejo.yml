http:
  routers:
    forgejo:
      rule: Host(`git.home.northlake.dev`)
      entryPoints:
        - websecure
      service: forgejo
      middlewares:
        - northlake-errors@file
        - private-net@file
      tls:
        certResolver: letsencrypt
    # Docker hairpin requests arrive from the Traefik bridge gateway.
    # Permit authenticated Git reads of Compose only; keep the web UI private.
    forgejo-arcane-git-read:
      rule: Host(`git.home.northlake.dev`) && ClientIP(`172.30.0.1/32`) && (Path(`/nicholas/docker-compose.git/info/refs`) || Path(`/nicholas/docker-compose.git/git-upload-pack`)) && (Method(`GET`) || Method(`POST`))
      priority: 100
      entryPoints:
        - websecure
      service: forgejo
      middlewares:
        - northlake-errors@file
      tls:
        certResolver: letsencrypt
  services:
    forgejo:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:3030
tcp:
  routers:
    forgejo-ssh:
      entryPoints:
        - forgejo-ssh
      rule: HostSNI(`*`)
      service: forgejo-ssh
      middlewares:
        - forgejo-ssh-private
  services:
    forgejo-ssh:
      loadBalancer:
        servers:
          - address: 10.10.60.200:2222
  middlewares:
    forgejo-ssh-private:
      ipAllowList:
        sourceRange:
          - 10.0.0.0/16
          - 10.10.0.0/16
          - 100.86.0.0/16
          - 192.168.100.0/24
          - 127.0.0.1/32
