http:
  routers:
    vaultls:
      rule: Host(`mtls.home.northlake.dev`)
      entryPoints:
        - websecure
      service: vaultls
      middlewares:
        - northlake-errors@file
        - private-net@file
      tls:
        certResolver: letsencrypt
  services:
    vaultls:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:5173
