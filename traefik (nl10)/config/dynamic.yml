http:
  routers:
    karakeep:
      rule: Host(`karakeep.northlake.dev`)
      entryPoints:
        - websecure
      service: karakeep
      tls:
        certResolver: letsencrypt

    frigate-redirect:
      rule: Host(`frigate.northlake.dev`)
      entryPoints:
        - websecure
      service: frigate
      middlewares:
        - frigate-redirect-to-home
      tls:
        certResolver: letsencrypt

    frigate:
      rule: Host(`frigate.home.northlake.dev`)
      entryPoints:
        - websecure
      service: frigate
      middlewares:
        - frigate-oauth-errors
        - frigate-oauth-auth
        - frigate-proxy-secret
      tls:
        certResolver: letsencrypt

    frigate-oauth2:
      rule: Host(`frigate.home.northlake.dev`) && PathPrefix(`/oauth2/`)
      entryPoints:
        - websecure
      service: frigate-oauth2-proxy
      middlewares:
        - auth-headers
      priority: 100
      tls:
        certResolver: letsencrypt

    homeassistant:
      rule: Host(`homeassistant.northlake.dev`)
      entryPoints:
        - websecure
      service: homeassistant
      tls:
        certResolver: letsencrypt

    picpeak:
      rule: Host(`picpeak.northlake.dev`)
      entryPoints:
        - websecure
      service: picpeak
      tls:
        certResolver: letsencrypt

    jellyfin:
      rule: Host(`stream.home.northlake.dev`)
      entryPoints:
        - websecure
      service: jellyfin
      tls:
        certResolver: letsencrypt

    kanidm:
      rule: Host(`idm.northlake.dev`)
      entryPoints:
        - websecure
      service: kanidm
      tls:
        certResolver: letsencrypt

    actual-nicholas:
      rule: Host(`nicholas.actualbudget.home.northlake.dev`)
      entryPoints:
        - websecure
      service: actual-nicholas
      tls:
        certResolver: letsencrypt

    actual-family:
      rule: Host(`family.actualbudget.home.northlake.dev`)
      entryPoints:
        - websecure
      service: actual-family
      tls:
        certResolver: letsencrypt

    actual-jacob:
      rule: Host(`jacob.actualbudget.home.northlake.dev`)
      entryPoints:
        - websecure
      service: actual-jacob
      tls:
        certResolver: letsencrypt

    pve1:
      rule: Host(`pve1.home.northlake.dev`)
      entryPoints:
        - websecure
      service: pve1
      middlewares:
        - private-net
      tls:
        certResolver: letsencrypt

    pve2:
      rule: Host(`pve2.home.northlake.dev`)
      entryPoints:
        - websecure
      service: pve2
      middlewares:
        - private-net
      tls:
        certResolver: letsencrypt

    truenas:
      rule: Host(`truenas.home.northlake.dev`)
      entryPoints:
        - websecure
      service: truenas
      middlewares:
        - private-net
        - truenas-client-cert-info
        - truenas-revocation-check
      tls:
        certResolver: letsencrypt
        options: truenas-client-mtls@file

    amp:
      rule: Host(`amp.home.northlake.dev`)
      entryPoints:
        - websecure
      service: amp
      middlewares:
        - private-net
      tls:
        certResolver: letsencrypt

  middlewares:
    private-net:
      ipAllowList:
        sourceRange:
          - 10.0.0.0/8
          - 100.86.0.0/16

    frigate-oauth-auth:
      forwardAuth:
        address: http://frigate-oauth2-proxy:4180/oauth2/auth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups

    frigate-oauth-errors:
      errors:
        status:
          - "401-403"
        service: frigate-oauth2-proxy
        query: /oauth2/sign_in?rd={url}
        statusRewrites:
          "401": 302

    frigate-redirect-to-home:
      redirectRegex:
        regex: '^https?://frigate\.northlake\.dev(?:/.*)?$'
        replacement: https://frigate.home.northlake.dev
        permanent: true

    auth-headers:
      headers:
        sslRedirect: true
        stsSeconds: 315360000
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true

    truenas-client-cert-info:
      passTLSClientCert:
        info:
          serialNumber: true
          notAfter: true
          notBefore: true
          subject:
            commonName: true
            organization: true
          issuer:
            commonName: true
            organization: true

    truenas-revocation-check:
      forwardAuth:
        address: http://mtls-revocation-checker:8080/auth
        trustForwardHeader: true
        maxResponseBodySize: 8192

  services:
    karakeep:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:3000

    frigate:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:8971

    frigate-oauth2-proxy:
      loadBalancer:
        servers:
          - url: http://frigate-oauth2-proxy:4180

    homeassistant:
      loadBalancer:
        servers:
          - url: http://10.10.60.155:9999

    picpeak:
      loadBalancer:
        servers:
          - url: http://10.10.50.253:3000

    jellyfin:
      loadBalancer:
        servers:
          - url: http://10.10.60.6:8096

    kanidm:
      loadBalancer:
        servers:
          - url: https://10.10.50.100:8443
        serversTransport: kanidm-transport

    actual-nicholas:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:5006

    actual-family:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:5007

    actual-jacob:
      loadBalancer:
        servers:
          - url: http://10.10.60.200:5008

    pve1:
      loadBalancer:
        servers:
          - url: https://10.10.70.100:8006
        serversTransport: pve1-transport

    pve2:
      loadBalancer:
        servers:
          - url: https://10.10.70.200:8006
        serversTransport: pve2-transport

    truenas:
      loadBalancer:
        servers:
          - url: https://10.10.60.250
        serversTransport: truenas-transport

    amp:
      loadBalancer:
        servers:
          - url: http://10.10.50.50:8080

  serversTransports:
    kanidm-transport:
      insecureSkipVerify: true
    pve1-transport:
      insecureSkipVerify: true
    pve2-transport:
      insecureSkipVerify: true
    truenas-transport:
      insecureSkipVerify: true

tls:
  options:
    truenas-client-mtls:
      maxVersion: VersionTLS12
      clientAuth:
        clientAuthType: RequireAndVerifyClientCert
        caFiles:
          - /etc/traefik/dynamic/certs/northlake-identity-issuing-ca-01.crt.pem
          - /etc/traefik/dynamic/certs/northlake-root-ca.crt.pem
