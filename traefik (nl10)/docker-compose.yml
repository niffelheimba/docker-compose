services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.sendAnonymousUsage=false
      - --api.dashboard=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.http.tls.certResolver=letsencrypt
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=nd.personal@icloud.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=info
      - --log.format=common
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/var/log/traefik/access.log
    volumes:
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt
      - /home/service/docker-state/traefik/logs:/var/log/traefik
      - ./config:/etc/traefik/dynamic:ro
    networks:
      - traefik-net

  mtls-revocation-checker:
    image: python:3.13-alpine
    container_name: mtls-revocation-checker
    restart: unless-stopped
    command: python /app/revocation_checker.py
    environment:
      OPENBAO_CERT_BASE_URL: https://secrets.cloud.northlake.dev/v1/pki_user_mtls/cert
      CACHE_TTL_SECONDS: "30"
      FAIL_CLOSED: "true"
    volumes:
      - ./revocation-checker:/app:ro
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge
