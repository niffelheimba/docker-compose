services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "${BIND_IP:-10.10.50.100}:80:80"
      - "${BIND_IP:-10.10.50.100}:443:443"
      - "${BIND_IP:-10.10.50.100}:443:443/udp"
    command:
      - --global.sendAnonymousUsage=false
      - --api.dashboard=false
      - --entryPoints.http.address=:80
      - --entryPoints.https.address=:443
      - --entryPoints.http.http.redirections.entryPoint.to=https
      - --entryPoints.http.http.redirections.entryPoint.scheme=https
      - --entryPoints.https.http.tls.certResolver=letsencrypt
      - --entryPoints.https.http3=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-nd.personal@icloud.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=info
      - --log.format=common
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/var/log/traefik/access.log
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt
      - /home/service/docker-state/traefik/logs:/var/log/traefik
      - ./config/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./config/certs:/etc/traefik/dynamic/certs:ro
    networks:
      - traefik-public
      - traefik-private
    labels:
      traefik.enable: "false"

  mtls-revocation-checker:
    image: python:3.13-alpine
    container_name: mtls-revocation-checker
    restart: unless-stopped
    command: python /app/revocation_checker.py
    environment:
      OPENBAO_CERT_BASE_URL: https://secrets.cloud.northlake.dev/v1/pki_user_mtls/cert
      CACHE_TTL_SECONDS: "30"
      FAIL_CLOSED: "true"
    volumes:
      - ./revocation-checker:/app:ro
    networks:
      - traefik-private
    labels:
      traefik.enable: "false"

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
  traefik-private:
    name: traefik-private
    driver: bridge
