services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.sendAnonymousUsage=false
      # Internal-only API for the local Traefik Manager agent; port 8080 is
      # not published on the host.
      - --api=true
      - --api.dashboard=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.http.tls.certResolver=letsencrypt
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=nd.personal@icloud.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=info
      - --log.format=common
      - --accesslog=true
      - --accesslog.format=json
      # Send JSON access logs to stdout so Alloy's Docker source collects them.
    volumes:
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt
      - /home/service/docker-state/traefik/logs:/var/log/traefik
      # Traefik Manager owns this host runtime directory after migration.
      - /home/service/docker-state/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik-net

  traefik-manager-agent:
    image: ghcr.io/chr0nzz/traefik-manager-agent:v1.15.0
    container_name: traefik-manager-agent
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TMA_API_KEY: "${TMA_NL10_API_KEY:-}"
      TRAEFIK_API_URL: http://traefik:8080
      CONFIG_PATH: /app/config
      ACME_JSON_PATH: /letsencrypt/acme.json
    ports:
      # Private/Tailscale only. Restrict port 8090 to NL00 in the host firewall.
      # Loopback is a safe bootstrap default. Override with NL10's private or
      # Tailscale IP in Arcane before registering this remote agent.
      - "${TMA_NL10_BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      - /home/service/docker-state/traefik/dynamic:/app/config
      - /home/service/docker-state/traefik/letsencrypt:/letsencrypt:ro
      - traefik-manager-agent-backups:/app/backups
    networks:
      - traefik-net

  mtls-revocation-checker:
    image: python:3.13-alpine
    container_name: mtls-revocation-checker
    restart: unless-stopped
    command: python /app/revocation_checker.py
    environment:
      OPENBAO_CERT_BASE_URL: https://secrets.cloud.northlake.dev/v1/pki_user_mtls/cert
      CACHE_TTL_SECONDS: "30"
      FAIL_CLOSED: "true"
    volumes:
      - ./revocation-checker:/app:ro
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge

volumes:
  traefik-manager-agent-backups:
