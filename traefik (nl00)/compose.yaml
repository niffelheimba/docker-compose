services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.sendAnonymousUsage=false
      # Internal-only API for Traefik Manager; port 8080 is not published on
      # the host, so it is reachable only from containers on this Docker network.
      - --api=true
      - --api.insecure=true
      - --api.dashboard=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.http.tls.certResolver=letsencrypt
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=nd.personal@icloud.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=info
      - --log.format=common
      - --accesslog=true
      - --accesslog.format=json
      # Send JSON access logs to stdout so Alloy's Docker source collects them.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53 # Oracle DNS does not work for the DNS challenge.
    volumes:
      - /home/docker-secure/docker-state/traefik/letsencrypt:/letsencrypt
      - /home/docker-secure/docker-state/traefik/logs:/var/log/traefik
      # Traefik Manager owns this host runtime directory after migration.
      - /home/docker-secure/docker-state/traefik/dynamic:/etc/traefik/dynamic:ro
      - /home/docker-secure/docker-compose/KanIDM/internal-certs/traefik/northlake-kanidm-internal-ca.crt:/etc/traefik/certs/northlake-kanidm-internal-ca.crt:ro
    networks:
      - uptime-net
      - kanidm-net
      - vaultwarden-net
      - caddy-net
      - arcane-net
      - semaphore-net
      - traefik-manager-net

  traefik-manager:
    # Upstream currently publishes the ARM64-compatible Docker image as latest;
    # the v1.15.0 tag is not available to OCI VM1's Docker engine.
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    environment:
      # Traefik Manager is served through the HTTPS-only public route.
      COOKIE_SECURE: "true"
      # NL00 is local to the control plane, so Manager connects directly rather
      # than through a redundant agent.
      TRAEFIK_API_URL: http://traefik:8080
      CONFIG_DIR: /app/traefik
      ACME_JSON_PATH: /letsencrypt/acme.json
    ports:
      # Private/Tailscale only; do not expose the control plane publicly.
      # Loopback is a safe bootstrap default. Override with NL00's private or
      # Tailscale IP in Arcane before accessing the Manager UI remotely.
      - "${TMA_MANAGER_BIND_IP:-127.0.0.1}:5000:5000"
    volumes:
      - /home/docker-secure/docker-state/traefik-manager/config:/app/config
      - /home/docker-secure/docker-state/traefik-manager/backups:/app/backups
      - /home/docker-secure/docker-state/traefik/dynamic:/app/traefik
      - /home/docker-secure/docker-state/traefik/letsencrypt:/letsencrypt:ro
    networks:
      - traefik-manager-net

networks:
  uptime-net:
    external: true
  kanidm-net:
    external: true
  vaultwarden-net:
    external: true
  caddy-net:
    external: true
  arcane-net:
    external: true
  semaphore-net:
    external: true
    name: semaphore_default
  traefik-manager-net:
    driver: bridge
