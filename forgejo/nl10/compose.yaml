name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
    container_name: forgejo
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: America/New_York
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-10.10.60.200}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://10.10.60.200:3030/}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN:-10.10.60.200}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "${FORGEJO_BIND_IP:-10.10.60.200}:${FORGEJO_HTTP_PORT:-3030}:3000"
      - "${FORGEJO_BIND_IP:-10.10.60.200}:${FORGEJO_SSH_PORT:-2222}:2222"
    volumes:
      - forgejo-data:/var/lib/gitea
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  forgejo-data:
