name: homelable

services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:618ee16e76f7cf1fe9aee5751966a042f7c58416defd9943b119a0a3c7c00c0d
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
    volumes:
      - backend_data:/app/data
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - homelable

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:4e20973b35e2d0f7d58bb40369c84d72751f1f5c154b202c3ec8b2c5d4632a3a
    restart: unless-stopped
    ports:
      - "${HOMELABLE_BIND_IP:-0.0.0.0}:${HOMELABLE_PORT:-3010}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homelable

  mcp:
    image: ghcr.io/pouzor/homelable-mcp:${HOMELABLE_VERSION:-latest}
    profiles: ["mcp"]
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_SERVICE_KEY: ${MCP_SERVICE_KEY:-}
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8001}:8001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homelable

volumes:
  backend_data:

networks:
  homelable:
    driver: bridge
