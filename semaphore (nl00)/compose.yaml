services:
  mysql:
    restart: unless-stopped
    image: mysql:8.0
    hostname: mysql
    volumes:
      - semaphore-mysql:/var/lib/mysql
    env_file:
      - .env
    networks:
      - default
      - caddy-net

  semaphore:
    restart: unless-stopped
    image: semaphoreui/semaphore:latest
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - default

volumes:
  semaphore-mysql:
    name: semaphore_semaphore-mysql

networks:
  caddy-net:
    external: true
