name: bambuddy

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:1.3.2@sha256:b33dedde7424d6fd939c32f1fa55a76044486e96f75417a581483a042bbf5d01
    container_name: bambuddy
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: America/New_York
      PUID: "1000"
      PGID: "1000"
      PORT: "8000"
      BAMBUDDY_OIDC_NAME: KanIDM
      BAMBUDDY_OIDC_ISSUER_URL: https://idm.northlake.dev/oauth2/openid/bambuddy
      BAMBUDDY_OIDC_CLIENT_ID: bambuddy
      BAMBUDDY_OIDC_SCOPES: openid email profile
      BAMBUDDY_OIDC_ENABLED: "true"
      BAMBUDDY_OIDC_AUTO_CREATE_USERS: "true"
      BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "false"
      BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
      BAMBUDDY_OIDC_DEFAULT_GROUP: Viewers
      BAMBUDDY_OIDC_GROUP_CLAIM: groups
      BAMBUDDY_OIDC_GROUP_MAPPING: '{"bambuddy_admins":"Administrators","northlake_family_users":"Operators"}'
      SLICER_API_URL: http://orca-slicer-api:3000
    env_file:
      - /home/service/docker-secrets/bambuddy/oidc.env
    ports:
      - "${BAMBUDDY_BIND_IP:-10.10.60.200}:${BAMBUDDY_HTTP_PORT:-8000}:8000"
    volumes:
      - bambuddy-data:/app/data
      - bambuddy-logs:/app/logs
    cap_drop:
      - NET_RAW
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional server-side slicing. Enable the slicer profile explicitly in Arcane.
  # No published port: only Bambuddy can reach this API on the project network.
  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:latest
    profiles: [slicer]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAX_MODEL_UPLOAD_MB: "512"
    volumes:
      - orca-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bambuddy-data:
  bambuddy-logs:
  orca-data:
