name: oauth2proxy

services:
  frigate-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    container_name: frigate-oauth2-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OAUTH2_PROXY_HTPASSWD_FILE: /etc/oauth2-proxy/ha.htpasswd
      OAUTH2_PROXY_HTPASSWD_USER_GROUPS: frigate_admins@idm.northlake.dev
      OAUTH2_PROXY_DISPLAY_HTPASSWD_FORM: "false"
    volumes:
      - /home/service/docker-state/oauth2-proxy-ha/ha.htpasswd:/etc/oauth2-proxy/ha.htpasswd:ro
    networks:
      - default
      - traefik-net
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: frigate-oauth2-redis
    restart: unless-stopped
    networks:
      - default
      - traefik-net

networks:
  traefik-net:
    external: true
    name: nl10-traefik_traefik-net
