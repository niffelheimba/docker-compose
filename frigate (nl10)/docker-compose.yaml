services:
  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
    image: ghcr.io/blakeblackshear/frigate:0.18.0-beta2
    shm_size: "768mb"

    entrypoint: >
      sh -c 'sleep 90;
      until [ -f /media/frigate/.nas-ready ]; do
        echo "Waiting for NAS mount /media/frigate...";
        sleep 10;
      done;
      exec /init'

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/Frigate/config:/config
      - /mnt/Frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 3000000000
          
    ports:
      # - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
      - "1984:1984" #go2rtc
    mem_limit: 8g
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      northlake.traefik.scope: public
      traefik.docker.network: traefik-public
      traefik.http.routers.frigate.rule: Host(`frigate.home.northlake.dev`)
      traefik.http.routers.frigate.entrypoints: https
      traefik.http.routers.frigate.middlewares: frigate-oauth-errors@file,frigate-oauth-auth@file
      traefik.http.routers.frigate.service: frigate
      traefik.http.routers.frigate.tls.certresolver: letsencrypt
      traefik.http.routers.frigate-redirect.rule: Host(`frigate.northlake.dev`)
      traefik.http.routers.frigate-redirect.entrypoints: https
      traefik.http.routers.frigate-redirect.middlewares: frigate-redirect-to-home@file
      traefik.http.routers.frigate-redirect.service: frigate
      traefik.http.routers.frigate-redirect.tls.certresolver: letsencrypt
      traefik.http.services.frigate.loadbalancer.server.port: "8971"

#    env_file:
#      - stack.env
volumes:
  frigate:
    driver: local
    driver_opts:
        type: "nfs4"
        o: "addr=10.10.60.250,nolock,hard,rw"
        device: ":/mnt/NAS1/NFS/Frigate"

networks:
  traefik-public:
    name: traefik-public
    external: true
