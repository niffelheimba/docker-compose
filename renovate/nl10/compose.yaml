name: renovate

services:
  renovate:
    image: ghcr.io/renovatebot/renovate:44.257.8@sha256:68f58fa3b0e92875fa2f44c4ae02936186818b0170c2d39fe7261a2af5260f36
    container_name: renovate
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/renovate/run.sh"]
    environment:
      TZ: America/New_York
      RENOVATE_CONFIG_FILE: /opt/renovate/config.js
      RENOVATE_BASE_DIR: /tmp/renovate
      RENOVATE_PLATFORM: ${RENOVATE_PLATFORM:-forgejo}
      RENOVATE_ENDPOINT: ${RENOVATE_ENDPOINT:-https://git.home.northlake.dev/api/v1/}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES:-nicholas/docker-compose}
      RENOVATE_INTERVAL_SECONDS: ${RENOVATE_INTERVAL_SECONDS:-3600}
      LOG_LEVEL: info
    volumes:
      - ./config.js:/opt/renovate/config.js:ro
      - ./run.sh:/opt/renovate/run.sh:ro
    secrets:
      - source: renovate_token
        target: renovate_token
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 1.0

secrets:
  renovate_token:
    file: ${RENOVATE_TOKEN_FILE:-/etc/renovate/forgejo-token}
