name: kanidm

services:
  certdumper:
    image: ghcr.io/kereis/traefik-certs-dumper:1.8.32@sha256:9b0d30ed3eefa8b2442fdbe7f3074591ee67b730e111946240fcd443e37e464d
    container_name: kanidm-home-certdumper
    command: --restart-containers kanidm-home
    restart: unless-stopped
    network_mode: none
    volumes:
      - /home/service/docker-state/traefik/letsencrypt:/traefik:ro
      - ./certs:/output:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOMAIN: idm.northlake.dev
      OVERRIDE_UID: "1000"
      OVERRIDE_GID: "1000"

  kanidmd:
    image: docker.io/kanidm/server:1.12.0@sha256:71b6ff5a9c9c32b632894d8acef5a2afc77941b35a0aa95dcee959fe688d5ce9
    container_name: kanidm-home
    restart: unless-stopped
    depends_on:
      - certdumper
    ports:
      - "3636:3636"
      - "8444:8444"
    extra_hosts:
      - "idm.northlake.dev:10.0.0.154"
    volumes:
      - ./server.toml:/data/server.toml:ro
      - ./data:/data
      - ./certs:/certs:ro
      - ./override.css:/hpkg/override.css:ro
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
    name: nl10-traefik_traefik-net
