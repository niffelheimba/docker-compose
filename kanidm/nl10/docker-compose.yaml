name: kanidm

services:
  certdumper:
    image: ghcr.io/kereis/traefik-certs-dumper:1.8.34@sha256:43ef6d16182cbbfb4f3317b7eb6aeaa52a54f1bdcd8c9c641406e3de686c63de
    container_name: kanidm-home-certdumper
    command: --restart-containers kanidm-home
    restart: unless-stopped
    network_mode: none
    volumes:
      - /home/service/docker-state/traefik/letsencrypt:/traefik:ro
      - ./certs:/output:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOMAIN: idm.northlake.dev
      OVERRIDE_UID: "1000"
      OVERRIDE_GID: "1000"

  kanidmd:
    image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
    container_name: kanidm-home
    restart: unless-stopped
    depends_on:
      - certdumper
    ports:
      - "3636:3636"
      - "8444:8444"
    extra_hosts:
      - "idm.northlake.dev:10.0.0.154"
    volumes:
      - ./server.toml:/data/server.toml:ro
      - ./data:/data
      - ./certs:/certs:ro
      - ./override.css:/hpkg/override.css:ro
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
    name: nl10-traefik_traefik-net
