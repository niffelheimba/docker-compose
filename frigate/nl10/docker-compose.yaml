name: frigate

services:
  frigate:
    container_name: frigate
    privileged: false
    restart: unless-stopped
    stop_grace_period: 30s
    image: ghcr.io/blakeblackshear/frigate:0.18.3@sha256:d1a3e0008557bb3f3314d442ecd4ba68e9b16ab7872d64612649f7a6e5156635
    shm_size: "768mb"

    entrypoint: >
      sh -c 'sleep 90;
      until [ -f /media/frigate/.nas-ready ]; do
        echo "Waiting for NAS mount /media/frigate...";
        sleep 10;
      done;
      exec /init'

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/Frigate/config:/config
      - ${FRIGATE_MEDIA_PATH:-/mnt/Frigate-rootless}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 3000000000
          
    ports:
      - "8971:8971" # Authenticated UI consumed by remote Traefik.
      # - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
      - "1984:1984" #go2rtc
    mem_limit: 8g
    security_opt:
      - no-new-privileges:true

#    env_file:
#      - stack.env
